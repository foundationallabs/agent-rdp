name: Pace Release

# Publishes @foundationallabs/agent-rdp and its platform packages to npm.
# Trigger: push a `pace-v*` tag, or run manually. Versions come from the package.json files.
on:
  push:
    tags:
      - 'pace-v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        run: sh scripts/install-rust.sh

      - name: Test Rust
        run: cargo test --locked --workspace

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b # v2.4.1
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: Build TypeScript
        run: pnpm --filter ./packages/agent-rdp run build:ts

      - name: Test TypeScript
        run: pnpm --filter ./packages/agent-rdp run test

  # Linux builds run in an ubuntu:22.04 container (glibc 2.35) for broad compatibility.
  # Without this, ubuntu-latest (24.04) produces binaries requiring glibc 2.39+.
  build-linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            package: linux-x64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            package: linux-arm64

    runs-on: ${{ matrix.runner }}
    container:
      image: ubuntu:22.04

    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y curl build-essential pkg-config cmake

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
          . "$HOME/.cargo/env"
          sh scripts/install-rust.sh --target ${{ matrix.target }}
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Build
        run: |
          . "$HOME/.cargo/env"
          cargo build --release --locked --target ${{ matrix.target }}

      - name: Copy binary and models to package
        run: |
          mkdir -p packages/${{ matrix.package }}/bin
          mkdir -p packages/${{ matrix.package }}/models
          cp target/${{ matrix.target }}/release/agent-rdp packages/${{ matrix.package }}/bin/
          chmod +x packages/${{ matrix.package }}/bin/agent-rdp
          cp models/*.rten packages/${{ matrix.package }}/models/

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.package }}
          path: packages/${{ matrix.package }}/

  build-darwin:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        run: sh scripts/install-rust.sh --target aarch64-apple-darwin

      - name: Build
        run: cargo build --release --locked --target aarch64-apple-darwin

      - name: Copy binary and models to package
        run: |
          mkdir -p packages/darwin-arm64/bin
          mkdir -p packages/darwin-arm64/models
          cp target/aarch64-apple-darwin/release/agent-rdp packages/darwin-arm64/bin/
          chmod +x packages/darwin-arm64/bin/agent-rdp
          cp models/*.rten packages/darwin-arm64/models/

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: darwin-arm64
          path: packages/darwin-arm64/

  publish:
    needs: [test, build-linux, build-darwin]
    # Publish only from a tag, including manual runs; a branch dispatch builds but does not publish.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Restore platform packages
        run: |
          for platform in darwin-arm64 linux-x64 linux-arm64; do
            cp -r artifacts/$platform/* packages/$platform/
            chmod +x packages/$platform/bin/*
          done
          ls -la packages/*/bin/

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Trusted publishing needs npm >= 11.5.1; Node 24 bundles npm 11.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install pnpm
        uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b # v2.4.1
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: Build TypeScript
        run: pnpm --filter ./packages/agent-rdp run build:ts

      - name: Check versions and tag agree
        run: |
          version=$(node -p "require('./packages/agent-rdp/package.json').version")
          for platform in darwin-arm64 linux-x64 linux-arm64; do
            v=$(node -p "require('./packages/$platform/package.json').version")
            if [ "$v" != "$version" ]; then
              echo "packages/$platform is $v, expected $version"
              exit 1
            fi
          done
          cargo_version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "$cargo_version" != "$version" ]; then
            echo "Cargo.toml is $cargo_version, expected $version"
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "pace-v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi

      - name: Check npm supports trusted publishing
        run: |
          npm_version=$(npm --version)
          if ! node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$npm_version"; then
            echo "npm $npm_version is older than 11.5.1, which trusted publishing requires"
            exit 1
          fi

      # Platform packages go first so the main package's optionalDependencies resolve as soon as it is live.
      - name: Publish platform packages
        run: |
          for platform in darwin-arm64 linux-x64 linux-arm64; do
            name=$(node -p "require('./packages/$platform/package.json').name")
            version=$(node -p "require('./packages/$platform/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published, skipping"
              continue
            fi
            npm publish ./packages/$platform --access public --provenance
          done

      # npm does not rewrite the `workspace:*` optionalDependencies; the script pins them to the real version.
      - name: Publish main package
        run: |
          name=$(node -p "require('./packages/agent-rdp/package.json').name")
          version=$(node -p "require('./packages/agent-rdp/package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published, skipping"
            exit 0
          fi
          cp README.md packages/agent-rdp/
          node scripts/resolve-workspace-deps.cjs packages/agent-rdp
          # TypeScript was built above; skip prepublishOnly so publish does not rebuild.
          npm publish ./packages/agent-rdp --access public --provenance --ignore-scripts
