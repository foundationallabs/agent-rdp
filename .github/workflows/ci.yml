name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read # dorny/paths-filter lists the PR's changed files

jobs:
  test:
    if: github.event_name == 'push' || !github.event.pull_request.draft
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check for Rust changes
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          filters: |
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - '.github/workflows/ci.yml'

      - name: Install Rust
        if: steps.filter.outputs.rust == 'true'
        shell: bash
        run: sh scripts/install-rust.sh

      - name: Cache cargo
        if: steps.filter.outputs.rust == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        if: steps.filter.outputs.rust == 'true'
        run: cargo build --all-targets

      - name: Test
        if: steps.filter.outputs.rust == 'true'
        run: cargo test

      - name: Skip message
        if: steps.filter.outputs.rust != 'true'
        run: echo "No Rust changes detected, skipping build and test"

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check for TypeScript changes
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          filters: |
            ts:
              - 'packages/agent-rdp/src/**/*.ts'
              - 'packages/agent-rdp/test/**'
              - 'packages/agent-rdp/package.json'
              - 'packages/agent-rdp/tsconfig.json'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'

      - name: Setup Node.js
        if: steps.filter.outputs.ts == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Install pnpm
        if: steps.filter.outputs.ts == 'true'
        uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b # v2.4.1
        with:
          version: 9

      - name: Install dependencies
        if: steps.filter.outputs.ts == 'true'
        run: pnpm install --ignore-scripts

      - name: Lint
        if: steps.filter.outputs.ts == 'true'
        run: pnpm run lint

      - name: TypeScript check
        if: steps.filter.outputs.ts == 'true'
        run: pnpm run build:ts

      - name: TypeScript tests
        if: steps.filter.outputs.ts == 'true'
        run: pnpm --filter ./packages/agent-rdp run test

      - name: Skip message
        if: steps.filter.outputs.ts != 'true'
        run: echo "No TypeScript changes detected, skipping typecheck"

  lint-powershell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check for PowerShell changes
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          filters: |
            ps:
              - '**/*.ps1'
              - '.github/workflows/ci.yml'

      - name: Lint PowerShell scripts
        if: steps.filter.outputs.ps == 'true'
        shell: pwsh
        run: ./scripts/lint-ps1.ps1

      - name: Skip message
        if: steps.filter.outputs.ps != 'true'
        run: echo "No PowerShell changes detected, skipping lint"

  schema-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check for schema-related changes
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          filters: |
            schema:
              - 'crates/agent-rdp-protocol/**'
              - 'packages/agent-rdp/src/types.ts'
              - 'crates/agent-rdp-daemon/src/automation/scripts/**'
              - '.github/workflows/ci.yml'

      - name: Install Rust
        if: steps.filter.outputs.schema == 'true'
        shell: bash
        run: sh scripts/install-rust.sh

      - name: Cache cargo
        if: steps.filter.outputs.schema == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-schema-${{ hashFiles('**/Cargo.lock') }}

      - name: Generate TypeScript types and fixtures
        if: steps.filter.outputs.schema == 'true'
        run: cargo test -p agent-rdp-protocol --lib

      - name: Verify generated TypeScript types are fresh
        if: steps.filter.outputs.schema == 'true'
        run: |
          if [ ! -d "packages/agent-rdp/src/generated" ]; then
            echo "Generated TypeScript directory not found"
            exit 1
          fi
          count=$(ls -1 packages/agent-rdp/src/generated/*.ts 2>/dev/null | wc -l)
          echo "Generated $count TypeScript files"
          if [ "$count" -lt 10 ]; then
            echo "Expected at least 10 generated TypeScript files"
            exit 1
          fi
          # Check that generated files match what's checked in
          if git diff --quiet packages/agent-rdp/src/generated/; then
            echo "Generated TypeScript files are up-to-date"
          else
            echo "ERROR: Generated TypeScript files are out of date!"
            echo "Please run 'cargo test -p agent-rdp-protocol generate' and commit the changes"
            git diff packages/agent-rdp/src/generated/
            exit 1
          fi

      - name: Verify generated fixtures are fresh
        if: steps.filter.outputs.schema == 'true'
        run: |
          if git diff --quiet fixtures/; then
            echo "Generated fixtures are up-to-date"
          else
            echo "ERROR: Generated fixtures are out of date!"
            echo "Please run 'cargo test -p agent-rdp-protocol generate' and commit the changes"
            git diff fixtures/
            exit 1
          fi

      - name: Validate PowerShell fixtures
        if: steps.filter.outputs.schema == 'true'
        shell: pwsh
        run: ./scripts/test-ps-fixtures.ps1

      - name: Skip message
        if: steps.filter.outputs.schema != 'true'
        run: echo "No schema-related changes detected, skipping validation"
